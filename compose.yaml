services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galeris}
      POSTGRES_USER: ${POSTGRES_USER:-galeris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galeris}
    ports:
      - "5432:5432"
    volumes:
      - galeris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-galeris} -d ${POSTGRES_DB:-galeris}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  galeris_postgres_data:
